<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName lesson8.local

	ServerAdmin admin@lesson8.local
	DocumentRoot /opt/apache2/www/lesson8.local
	DirectoryIndex lesson8.html

	<Directory / >
		Require all granted
	</Directory>

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/lesson8.crt 
	SSLCertificateKeyFile /etc/ssl/private/lesson8.key

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
	ServerName www.lesson8.local
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/lesson8.crt 
	SSLCertificateKeyFile /etc/ssl/private/lesson8.key
	Redirect permanent / https://lesson8.local
</VirtualHost>
</IfModule>

<VirtualHost *:80>
	ServerName lesson8.local
	ServerAlias www.lesson8.local
	Redirect permanent / https://lesson8.local
</VirtualHost>
