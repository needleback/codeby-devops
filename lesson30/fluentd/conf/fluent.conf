<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>


<filter service.post>
  @type parser
  format json
  key_name log
</filter>


# парсинг с помощью регулярки
<filter service.ui>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type regexp
    expression /^\S+\W+\[(?<time>\S+)\s\#1\]\s+(?<level>\S+)\s+--\W+service=(?<service>\S+)\W+event=(?<event>\S+)\W+request_id=(?<request_id>\S+)\W+message='(?<message>.+?)'\W+params:\s+(?<params>.+?)$/
  </parse>
</filter>

# парсим с помощью grok
<filter service.ui>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type grok
    grok_pattern I,\s+\[%{TIMESTAMP_ISO8601:time}\s#%{NUMBER:pid}\]\s+%{LOGLEVEL:level}\s+--\s+:\s+service=%{WORD:service}\s+\|\s+event=%{WORD:event}\s+\|\s+request_id=%{UUID:request_id}\s+\|\s+message='%{DATA:message}'\s+\|\s+params:\s+%{GREEDYDATA:params}
  </parse>
</filter>

# парсим json поле params в полученном результате
<filter service.ui>
  @type parser
  key_name params
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
  </parse>
</filter>



<match *.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    log_es_400_reason true
    logstash_prefix fluentd
    logstash_dateformat %Y%m%d
    include_tag_key true
    type_name access_log
    tag_key @log_name
    flush_interval 1s
  </store>
  <store>
    @type stdout
  </store>
</match>
