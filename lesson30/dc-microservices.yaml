services:
  post_db:
    image: mongo:3.2
    container_name: post_db
    volumes:
      - post_db:/data/db
    networks:
      - logging

  ui:
    image: ${REGISTRY}/ui:${TAG}
    container_name: ui
    environment:
      - POST_SERVICE_HOST=post
      - POST_SERVICE_PORT=5000
      - COMMENT_SERVICE_HOST=comment
      - COMMENT_SERVICE_PORT=9292
    ports:
      - 9292:9292/tcp
    depends_on:
      - comment
      - post
    logging:
      driver: fluentd
      options:
        "fluentd-address": "localhost:24224"
        "tag": "service.ui"
    networks:
      - logging

  comment:
    image: ${REGISTRY}/comment:${TAG}
    container_name: comment
    environment:
      - COMMENT_DATABASE_HOST=post_db
      - COMMENT_DATABASE=comments
    depends_on:
      - post_db
    networks:
      - logging

  post:
    image: ${REGISTRY}/post:${TAG}
    container_name: post
    environment:
      - POST_DATABASE_HOST=post_db
      - POST_DATABASE=posts
    depends_on:
      - post_db
    logging:
      driver: fluentd
      options:
        "fluentd-address": "localhost:24224"
        "tag": "service.post"
    ports:
      - 5000:5000
    networks:
      - logging

volumes:
  post_db:

networks:
  logging:
