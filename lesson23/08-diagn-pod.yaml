---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagn-sa
  namespace: dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: diagn-sa
    namespace: dev
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Pod
metadata:
  name: diagnostic
  namespace: dev
spec:
  serviceAccountName: diagn-sa
  restartPolicy: Never
  containers:
    - name: kubectl
      image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting diagnostic pod..."
          while true; do
            echo "===== Wordpress pods ====="
            kubectl get pods -n dev -l app=wordpress
            echo "=========================="
            sleep 10
          done
